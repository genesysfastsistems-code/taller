<title>KEVANIX Taller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: header con usuario/sucursal + tabs por rol; tablero operativo; kanban horizontal para OTs */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --sunk:#F5F7F8; --ink:#16202A; --muted:#5B6875; --line:#D6DDE3;
  --accent:#F2B705; --accent-ink:#1A1400; --blue:#1D4E89;
  --ok:#1F8A4C; --warn:#B86E00; --bad:#C2362B; --info:#2C6FB7; --orange:#D9661A;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2128; --sunk:#151B21; --ink:#E6EBEF; --muted:#93A1AE; --line:#2B3540;
  --accent:#F2B705; --accent-ink:#1A1400; --blue:#4F86C6;
  --ok:#46B57A; --warn:#E39A2D; --bad:#E06357; --info:#6AA5E6; --orange:#E8833A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2128; --sunk:#151B21; --ink:#E6EBEF; --muted:#93A1AE; --line:#2B3540;
  --accent:#F2B705; --accent-ink:#1A1400; --blue:#4F86C6;
  --ok:#46B57A; --warn:#E39A2D; --bad:#E06357; --info:#6AA5E6; --orange:#E8833A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{background:var(--ink);color:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:12px;height:22px;background:var(--accent);transform:skewX(-14deg)}
.who{display:flex;align-items:center;gap:8px;font-size:12px}
.who select{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);padding:4px 8px;width:auto}
.who select option{color:var(--ink);background:var(--surface)}
.who b{font-weight:600}
.who .out{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:6px;padding:4px 9px;font:600 12px var(--f-body);cursor:pointer}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;scrollbar-width:none}
nav.tabs button{background:transparent;border:0;color:var(--bg);opacity:.72;font:600 13px var(--f-body);padding:8px 12px;border-radius:6px;white-space:nowrap;cursor:pointer}
nav.tabs button.on{opacity:1;background:var(--accent);color:var(--accent-ink)}
nav.tabs button:hover{opacity:1}
main .wrap{padding-block:18px 60px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase}
h3{font-size:17px}
.sub{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.kpi b.m{font-size:22px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi.alert{border-color:var(--bad)} .kpi.alert b{color:var(--bad)}
.kpi.good b{color:var(--ok)}
.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--muted)}
.alertbar{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface));border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alertbar strong{color:var(--bad);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.note{font-size:12px;color:var(--muted);margin:0}
button.btn,label.btn,a.btn{font:600 13px var(--f-body);border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.field{display:grid;gap:4px}
.field>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-info{color:var(--info)} .c-mut{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tag.exp{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.gar{background:var(--bad);color:#fff;border-color:var(--bad)}
.plate{display:inline-flex;flex-direction:column;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:#fff;color:#111;min-width:96px;vertical-align:middle}
.plate em{background:var(--blue);color:#fff;font:600 8px var(--f-body);letter-spacing:.18em;text-align:center;padding:1px 4px;font-style:normal}
.plate strong{font:600 16px var(--f-mono);letter-spacing:.06em;text-align:center;padding:1px 8px}
.plate.big strong{font-size:24px;padding:3px 14px}
.plate.big em{font-size:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
tr.low td{background:color-mix(in srgb,var(--bad) 8%,transparent)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.mono{font-family:var(--f-mono)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h3{display:flex;justify-content:space-between;font-size:15px;text-transform:uppercase}
.col h3 small{font-family:var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--ink)}
.card .meta{font-size:12px;color:var(--muted)}
.steps{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.steps button{flex:1 0 auto;background:var(--surface);border:0;border-right:1px solid var(--line);padding:8px 12px;font:600 12px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.steps button:last-child{border-right:0}
.steps button.done{color:var(--ink);background:var(--sunk)}
.steps button.on{background:var(--ink);color:var(--bg)}
.steps button:disabled{cursor:not-allowed}
.fuel{display:flex;gap:3px;align-items:end}
.fuel i{width:10px;border-radius:2px;background:var(--line)}
.fuel i.f{background:var(--accent)}
.fuel.low i.f{background:var(--bad)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer;font-size:13px}
.checks input{width:auto}
.dmg{position:relative;max-width:360px;width:100%;aspect-ratio:3/4;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);cursor:crosshair}
.dmg.ro{cursor:default}
.dmg svg{width:100%;height:100%;display:block}
.dmg .pt{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font:700 11px var(--f-mono);display:grid;place-items:center;border:2px solid var(--surface)}
.dmglist{display:grid;gap:6px;font-size:13px;align-content:start}
.dmglist div{display:flex;gap:6px;align-items:center}
.dmglist b{background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font:700 11px var(--f-mono);flex:none}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;position:relative;width:96px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-size:11px;cursor:pointer}
.totals{display:grid;gap:4px;justify-items:end;font-variant-numeric:tabular-nums}
.totals b{font-family:var(--f-display);font-size:26px}
.timeline{display:grid;border-left:3px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 18px 18px}
.tl::before{content:"";position:absolute;left:-8px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl .km{font-family:var(--f-mono);font-weight:600}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.timer .clock{font:600 22px var(--f-mono)}
.live{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.neg i{background:var(--bad)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.stars button.on{color:var(--accent)}
.st{color:var(--accent);letter-spacing:1px;white-space:nowrap}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:20;display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px))}
.modal .box{background:var(--surface);border-radius:10px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:30;font-weight:500;max-width:90vw}
.kude{border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px;font-size:13px;background:var(--surface)}
.kude .hd{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.kude .cdc{font:500 11px var(--f-mono);word-break:break-all;color:var(--muted)}
.cli{max-width:560px;margin:0 auto;display:grid;gap:14px;width:100%}
.login{max-width:640px;margin:20px auto;display:grid;gap:14px;width:100%}
.users{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.ucard{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.ucard:hover,.ucard.on{border-color:var(--ink)}
.ucard.on{box-shadow:inset 4px 0 0 var(--accent)}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:13px}
/* Semáforo */
.sem{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.lane{border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);display:grid;align-content:start;gap:8px;padding:0 10px 12px;min-height:280px;outline:3px dashed transparent;outline-offset:2px}
.lane.over{outline-color:var(--ink)}
.lane>header{margin:0 -10px 2px;padding:10px 12px;border-radius:var(--r) var(--r) 0 0;display:grid;gap:1px}
.lane>header h3{display:flex;justify-content:space-between;align-items:center;font-size:17px;text-transform:uppercase}
.lane>header h3 small{font:600 14px var(--f-mono)}
.lane>header span{font-size:12px;opacity:.9}
.sem .card{cursor:grab;touch-action:pan-y;user-select:none}
.card.drag-src{opacity:.3}
.ghost{position:fixed;pointer-events:none;z-index:40;transform:rotate(2deg);box-shadow:0 14px 30px rgba(0,0,0,.28);margin:0}
.age{font:500 11px var(--f-mono);color:var(--muted)}
.age.late{color:var(--bad);font-weight:600}
.mini{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mini button{flex:1;border:0;background:var(--surface);font:600 11px var(--f-body);color:var(--muted);padding:4px 2px;cursor:pointer;border-right:1px solid var(--line)}
.mini button:last-child{border-right:0}
.mini button.on{background:var(--ok);color:#fff}
.lift{display:flex;gap:4px;align-items:center}
.lift i{width:26px;height:12px;border-radius:2px;background:var(--line)}
.lift i.on{background:var(--ink)}
.lift i.over{background:var(--bad)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px var(--f-mono);margin-left:5px}
.msg{display:grid;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.msg p{margin:0;white-space:pre-wrap;font-size:13px;background:var(--sunk);border-radius:6px;padding:8px 10px}
pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;font:500 12px/1.5 var(--f-mono);overflow-x:auto;margin:0;white-space:pre}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.prog i{height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--ok)}
/* Hoja A4 (siempre blanca: es papel) */
.sheetwrap{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff}
.sheet{width:794px;height:1123px;background:#fff;color:#111;font-family:"IBM Plex Sans",Arial,sans-serif;transform-origin:top left;font-size:12px;line-height:1.35}
.sheet .half{height:561px;padding:24px 32px 18px;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:10px;box-sizing:border-box}
.sheet .cut{height:1px;border-top:2px dashed #555;position:relative}
.sheet .cut span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;padding:0 10px;font:700 10px "IBM Plex Mono",monospace;letter-spacing:.2em;color:#555}
.sheet .hd{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:start;border-bottom:2px solid #111;padding-bottom:8px}
.sheet h4{font:700 26px "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:0;letter-spacing:.02em}
.sheet .k{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#555;font-weight:600}
.sheet .v{font-weight:600}
.sheet .grid4{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 16px;align-items:center}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.sheet .box{border:1px solid #111;border-radius:4px;padding:6px 8px}
.sheet .cks{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px}
.sheet .cks div{display:flex;gap:6px;align-items:center}
.sheet .cb{width:11px;height:11px;border:1.5px solid #111;display:inline-grid;place-items:center;font-size:9px;font-weight:700;line-height:1}
.sheet .lines div{border-bottom:1px solid #999;height:20px}
.sheet .foot{display:flex;justify-content:space-between;align-items:end;font:700 10px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.sheet .plateP{display:inline-flex;flex-direction:column;border:2px solid #111;border-radius:4px;overflow:hidden;text-align:center}
.sheet .plateP em{background:#1D4E89;color:#fff;font:600 7px Arial,sans-serif;letter-spacing:.2em;font-style:normal;padding:1px}
.sheet .plateP b{font:600 20px "IBM Plex Mono",monospace;padding:1px 10px;letter-spacing:.05em}
.sheet .fuelP{display:flex;gap:2px;align-items:end}
.sheet .fuelP i{width:8px;background:#ddd;border:1px solid #111}
.sheet .fuelP i.f{background:#111}
.sheet .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:22px}
.sheet .sign div{border-top:1px solid #111;padding-top:3px;text-align:center;font-size:10px}
.sheet canvas{display:block}
.sheet .qr{width:96px;height:96px;image-rendering:pixelated}
#printhost{position:fixed;left:-10000px;top:0}
@media print{
  body>*:not(#printhost),body::before{display:none!important}
  #printhost{position:static}
  #printhost .sheet{transform:none!important}
  @page{size:A4;margin:0}
}
.plans{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;background:var(--surface)}
.plan.cur{border-color:var(--ink);box-shadow:inset 0 4px 0 var(--accent)}
.plan b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.plan small{color:var(--muted)}
.cred{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:500 13px/1.7 var(--f-mono);white-space:pre-wrap;word-break:break-all;margin:0}
.devtag{background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
@media (max-width:520px){h1{font-size:25px}.kpi b{font-size:26px}.kpi b.m{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><i></i>KEVANIX Taller</div>
  <div class="who" id="who"></div>
  <nav class="tabs" id="nav"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="modal"></div>
<div id="printhost"></div>

function startSync(){
  st.syncOn=true;st.fase='cargando';render();const since=addD(hoy(),-150);
  COLS.forEach(c=>{let q=c==='usuarios'?FS.collection('usuarios').where('tallerId','==',st.tid):T(c);if(c==='movs'||c==='mensajes')q=q.where('fecha','>=',since);

  unsubs.push(T('meta').doc('config').onSnapshot(d=>{db.config=Object.assign(defCfg(),d.exists?d.data():{});lastCfg=stable(db.config);llego('config')},e=>syncErr('config',e)));

}
function syncErr(c,e){console.error(c,e);toast(e.code==='permission-denied'?'Sin permiso para leer '+c+'. Revisá las reglas de Firestore.':'Error de conexión: '+(e.code||e.message))}
function llego(c){if(!st.syncOn)return;listos.add(c);

function save(){
  if(!FS||st.fase!=='app')return;
  if(!st.soporte&&!memb(st.taller).ok)return toast('La membresía no está activa. No se guardan cambios.');
  const ops=[];
  COLS.forEach(c=>{const cur={};(db[c]||[]).forEach(x=>{if(!x.id)x.id=uid();cur[x.id]=stable(x)});const prev=last[c]||{};
    Object.keys(cur).forEach(id=>{if(cur[id]!==prev[id]){const d=JSON.parse(cur[id]);delete d.id;ops.push(['set',ref(c,id),d]);
      if(c==='ots'){const o=db.ots.find(x=>x.id===id);if(o.token)ops.push(['merge',FS.collection('publico').doc(o.token),pubDoc(o)])}}});
    Object.keys(prev).forEach(id=>{if(!(id in cur))ops.push(['del',ref(c,id)])});
    last[c]=cur});
  const cs=stable(db.config);if(cs!==lastCfg){ops.push(['set',T('meta').doc('config'),JSON.parse(cs)]);lastCfg=cs}
  for(let i=0;i<ops.length;i+=400){const b=FS.batch();ops.slice(i,i+400).forEach(([t,r,d])=>t==='set'?b.set(r,d):t==='merge'?b.set(r,d,{merge:true}):b.delete(r));
    b.commit().catch(e=>{console.error(e);toast(e.code==='permission-denied'?'Tu usuario no tiene permiso para ese cambio.':'No se pudo guardar en la nube ('+(e.code||e.message)+').')})}
}

const AUTH_ERR={'auth/invalid-credential':'Usuario o contraseña incorrectos.','auth/invalid-login-credentials':'Usuario o contraseña incorrectos.','auth/wrong-password':'Usuario o contraseña incorrectos.','auth/user-not-found':'Usuario o contraseña incorrectos.','auth/email-already-in-use':'Ese usuario o correo ya existe. Elegí otro.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-email':'El usuario o correo no es válido.','auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.','auth/unauthorized-domain':'Este dominio no está autorizado en Firebase Authentication.','auth/network-request-failed':'Sin conexión a internet.','auth/requires-recent-login':'Por seguridad, salí y volvé a ingresar antes de cambiar la contraseña.'};

  AUTH.sendPasswordResetEmail(v).then(()=>toast('Te enviamos un correo para cambiar la contraseña.'),x=>toast(authMsg(x)))}
function altaPrueba(){st.alta={taller:$('#a_t').value.trim(),nombre:$('#a_n').value.trim(),tel:$('#a_w').value.trim()};
  AUTH.createUserWithEmailAndPassword($('#a_e').value.trim(),$('#a_p').value).catch(e=>toast(authMsg(e)))}
async function crearTallerPrueba(){const a=st.alta;if(!a||!a.taller||!a.nombre)return;
  const u=AUTH.currentUser,tr=FS.collection('talleres').doc(),tid=tr.id,ahora=new Date().toISOString(),vence=addD(hoy(),P().diasPrueba);
  const b=FS.batch();

  b.set(FS.collection('usuarios').doc(u.uid),{tallerId:tid,nombre:a.nombre,email:u.email,usuario:userName(u.email),rol:'admin',sucursalId:'central',mecanicoId:'',activo:true,cambiarClave:false,creado:ahora});
  b.set(tr.collection('sucursales').doc('central'),{nombre:'Casa central',est:'001',pto:'001',nextFac:1});

  b.set(tr.collection('meta').doc('contadores'),{nextOT:1});
  try{await b.commit();st.alta=null;await onAuth(u);toast(`¡Taller creado! Tenés ${P().diasPrueba} días de prueba.`)}catch(e){console.error(e);toast('No se pudo crear el taller: '+(e.code||e.message))}}
async function claveForzada(){const a=$('#k_1').value,b=$('#k_2').value;if(a!==b)return toast('Las contraseñas no coinciden.');if(a.length<(st.esDev?10:6))return toast(`Usá al menos ${st.esDev?10:6} caracteres.`);
  const u=AUTH.currentUser;
  try{await u.updatePassword(a);
    if(st.esDev)await FS.collection('plataforma').doc('dev').set({claveCambiada:true,fecha:new Date().toISOString()});
    else await FS.collection('usuarios').doc(u.uid).update({cambiarClave:false});

function o_set(k,v){const o=ot();o[k]=v;save();render();if(k==='aprob')toast('Presupuesto '+v)}
function setEstado(e){const o=ot();if(isM()&&e==='entregado')return;
  if(e==='entregado'&&!isA()&&saldo(o)>0)return toast('Tiene saldo pendiente: la entrega la confirma el administrador.');
  if(e==='entregado'&&saldo(o)>0){modalHTML(`<h2>Entregar con saldo pendiente</h2><p>La OT #${o.nro} tiene un saldo de <b>${gs(saldo(o))}</b>. Quedará en la cuenta corriente de ${esc(cli(o.clienteId).nombre)}.</p><div class="row"><button class="btn pri" onclick="closeM();entregar()">Entregar igual</button><button class="btn" onclick="closeM()">Cancelar</button></div>`);return}
  if(e==='entregado')return entregar();
  moveTo(o,e)}
function moveTo(o,e,skipAsk){
  if(o.estado===e)return;
  if(e==='presupuesto'&&!o.items.length){toast('Cargá mano de obra y repuestos antes de enviar el presupuesto.');if(st.view!=='ot')go('ot',o.id);return}
  if(['reparacion','calidad','listo'].includes(e)&&o.aprob!=='aprobado'){toast('El cliente todavía no aprobó el presupuesto.');return}
  if(e==='repuestos'&&!skipAsk){
    modalHTML(`<h2>Espera de repuestos · OT #${o.nro}</h2><p class="sub" style="margin:0">Se avisa al encargado de compras y el auto queda pausado.</p>
    <label class="field"><span>¿Qué repuestos faltan?</span><textarea id="falt" placeholder="Ej.: Filtro de aire Amarok ×1">${esc(o.faltante||'')}</textarea></label>
    <div class="row"><button class="btn pri" onclick="pedirRep('${o.id}')">Pausar y avisar a compras</button><button class="btn" onclick="closeM()">Cancelar</button></div>`);setTimeout(()=>$('#falt')?.focus(),0);return}
  o.estado=e;o.estadoDesde=new Date().toISOString();
  if(e==='presupuesto'){o.aprob='pendiente';o.aprobNota='';autoMsg(o,'presupuesto');if(FS&&o.token)FS.collection('publico').doc(o.token).set({respuesta:null},{merge:true}).catch(()=>{})}
  if(e==='listo'){if(o.trabajando){o.horasReal=Math.round(horasOT(o)*100)/100;o.trabajando=null}autoMsg(o,'retiro')}
  save();render();toast(`OT #${o.nro}: ${est(e)}`)}
function pedirRep(id){const o=db.ots.find(x=>x.id===id),t=$('#falt').value.trim();if(!t)return toast('Indicá qué repuestos faltan.');
  o.faltante=t;if(o.trabajando){o.horasReal=Math.round(horasOT(o)*100)/100;o.trabajando=null}
  db.alertas.push({id:uid(),fecha:new Date().toISOString(),otId:o.id,texto:t,resuelta:false});closeM();moveTo(o,'repuestos',true);toast('Compras avisado: '+t)}
function autoMsg(o,tipo,force){
  if(!force&&!db.config.autoWA[tipo])return;
  if(!force&&db.mensajes.some(m=>m.otId===o.id&&m.tipo===tipo&&m.estado!=='descartado'))return;
  const c=cli(o.clienteId);db.mensajes.push({id:uid(),fecha:new Date().toISOString(),otId:o.id,tipo,tel:c.tel,nombre:c.nombre,texto:fillTpl(db.config.plantillas[tipo],o),estado:'pendiente',enviado:null});
  toast(`WhatsApp “${TPL_TIPOS[tipo]}” en cola para ${c.nombre.split(' ')[0]}`)}
function entregar(){const o=ot();if(o.trabajando){o.horasReal=Math.round(horasOT(o)*100)/100;o.trabajando=null}o.estado='entregado';o.fechaEntrega=hoy();if(!o.encuesta)o.encuesta={token:uid(),nota:null};save();render();enviarEncuesta(o.id)}
function enviarEncuesta(id){const o=db.ots.find(x=>x.id===id),c=cli(o.clienteId),v=veh(o.vehiculoId);
  const msg=`*${db.config.taller}*\nGracias por confiarnos su ${v.marca} ${v.modelo} (${v.chapa}). ¿Cómo fue su experiencia? Califíquenos en 10 segundos:\n${appURL('encuesta-'+o.encuesta.token)}`;
  const w=waLink(c.tel,msg);
  modalHTML(`<h2>Vehículo entregado</h2><p style="margin:0">Enviá la encuesta de satisfacción a ${esc(c.nombre)}.</p><textarea id="wa_t" readonly style="min-height:120px">${esc(msg)}</textarea>
  <div class="row">${w?`<a class="btn wa" href="${w}" target="_blank" rel="noopener">Abrir WhatsApp</a>`:''}<button class="btn" onclick="copiar()">Copiar</button><button class="btn" onclick="closeM();verCliente('encuesta','${o.id}')">Ver encuesta</button><button class="btn" onclick="closeM()">Cerrar</button></div>`)}
function modalHTML(h){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="box">${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function addMO(){modalHTML(`<h2>Mano de obra</h2><div class="fields"><label class="field" style="grid-column:1/-1"><span>Descripción</span><input id="m_d" placeholder="Ej.: Cambio de embrague"></label>
  <label class="field"><span>Cantidad</span><input id="m_c" value="1" inputmode="numeric"></label><label class="field"><span>Precio unitario (Gs.)</span><input id="m_p" inputmode="numeric"></label><label class="field"><span>Suma horas estimadas</span><input id="m_h" placeholder="0" inputmode="decimal"></label></div>
  <div class="row"><button class="btn pri" onclick="saveMO()">Agregar</button><button class="btn" onclick="closeM()">Cancelar</button></div>`);$('#m_d').focus()}
function saveMO(){const d=$('#m_d').value.trim(),c=num($('#m_c').value),p=num($('#m_p').value);if(!d||!c||!p)return toast('Completá descripción, cantidad y precio.');const o=ot();o.items.push({tipo:'mo',desc:d,cant:c,precio:p});o.horasEst=Math.round((o.horasEst+dec($('#m_h').value))*10)/10;save();closeM();render()}
function addRepLibre(){modalHTML(`<h2>Repuesto externo</h2><p class="note">Para piezas compradas a proveedor solo para esta OT (no salen del stock).</p><div class="fields"><label class="field" style="grid-column:1/-1"><span>Descripción</span><input id="x_d"></label>
  <label class="field"><span>Cantidad</span><input id="x_c" value="1" inputmode="numeric"></label><label class="field"><span>Costo unitario</span><input id="x_k" inputmode="numeric"></label><label class="field"><span>Precio de venta</span><input id="x_p" inputmode="numeric"></label></div>
  <div class="row"><button class="btn pri" onclick="const d=$('#x_d').value.trim(),c=num($('#x_c').value),p=num($('#x_p').value);if(!d||!c||!p)return toast('Completá descripción, cantidad y precio.');ot().items.push({tipo:'rep',desc:d,cant:c,precio:p,costo:num($('#x_k').value)});save();closeM();render()">Agregar</button><button class="btn" onclick="closeM()">Cancelar</button></div>`)}
function addRep(){modalHTML(`<h2>Repuesto de stock · ${esc(sucN(ot().sucursalId))}</h2><input id="rp_q" placeholder="Buscar por código o descripción" oninput="repList()"><div id="rp_l" class="tscroll" style="max-height:340px"></div><div class="row"><button class="btn" onclick="closeM()">Cerrar</button></div>`);repList();$('#rp_q').focus()}
function repList(){const q=$('#rp_q').value.toLowerCase(),sc=ot().sucursalId;$('#rp_l').innerHTML=`<table><tr><th>Repuesto</th><th class="n">Stock</th><th class="n">Precio</th><th class="n">Cant.</th><th></th></tr>${db.stock.filter(s=>(s.desc+s.cod).toLowerCase().includes(q)).map(s=>{const n=s.ex[sc]||0,otras=Object.entries(s.ex).filter(([k,x])=>k!==sc&&x>0);return `<tr class="${n<=s.min?'low':''}"><td>${esc(s.desc)}<div class="sub mono" style="font-size:11px">${esc(s.cod)}${otras.length?' · '+otras.map(([k,x])=>esc(sucN(k))+': '+x).join(', '):''}</div></td><td class="n">${n}</td><td class="n">${gs(s.precio)}</td><td class="n"><input id="q_${s.id}" value="1" style="width:56px" inputmode="numeric"></td><td><button class="btn sm pri" onclick="pickRep('${s.id}')" ${n?'':'disabled'}>Usar</button></td></tr>`}).join('')}</table>`}
function pickRep(id){const o=ot(),s=db.stock.find(x=>x.id===id),q=num($('#q_'+id).value),sc=o.sucursalId,n=s.ex[sc]||0;if(q<1)return;if(q>n)return toast(`Solo hay ${n} en ${sucN(sc)}. Pedí un traspaso o marcá “Espera repuestos”.`);
  s.ex[sc]=n-q;mov(s.id,sc,-q,'uso','OT #'+o.nro);o.items.push({tipo:'rep',stockId:s.id,desc:s.desc,cant:q,precio:s.precio,costo:s.costo});save();closeM();render();toast(`Descontado del stock: ${q} × ${s.desc}`)}
function delItem(k){const o=ot(),i=o.items[k];if(i.stockId){const s=db.stock.find(x=>x.id===i.stockId);if(s){s.ex[o.sucursalId]=(s.ex[o.sucursalId]||0)+i.cant;mov(s.id,o.sucursalId,i.cant,'devolución','OT #'+o.nro)}}o.items.splice(k,1);save();render()}
function addPago(){const o=ot();modalHTML(`<h2>Registrar cobro · OT #${o.nro}</h2><div class="fields"><label class="field"><span>Monto (Gs.)</span><input id="p_m" value="${saldo(o)}" inputmode="numeric"></label>
  <label class="field"><span>Medio</span><select id="p_md"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta de débito</option><option>Tarjeta de crédito</option><option>Billetera (Tigo/Personal)</option><option>Cheque</option></select></label><label class="field"><span>Fecha</span><input type="date" id="p_f" value="${hoy()}"></label></div>
  <div class="row"><button class="btn pri" onclick="savePago()">Registrar</button><button class="btn" onclick="closeM()">Cancelar</button></div>`)}
function savePago(){const m=num($('#p_m').value);if(m<=0)return toast('Ingresá un monto válido.');ot().pagos.push({fecha:$('#p_f').value||hoy(),monto:m,medio:$('#p_md').value});save();closeM();render();toast('Cobro registrado: '+gs(m))}
function enviarWA(){const o=ot(),v=veh(o.vehiculoId),c=cli(o.clienteId);
  const msg=fillTpl(db.config.plantillas.presupuesto,o);
  const w=waLink(c.tel,msg);
  modalHTML(`<h2>Enviar presupuesto por WhatsApp</h2><p class="sub" style="margin:0">Para: ${esc(c.nombre)} · <span class="mono">${esc(c.tel||'sin número cargado')}</span></p>
  <textarea id="wa_t" style="min-height:220px" readonly>${esc(msg)}</textarea>
  <div class="row">${w?`<a class="btn wa" href="${w}" target="_blank" rel="noopener">Abrir WhatsApp</a>`:''}<button class="btn" onclick="copiar()">Copiar mensaje</button><button class="btn" onclick="closeM()">Cerrar</button></div>
  <p class="note">El enlace abre la vista del cliente con Aprobar / Rechazar. Para que funcione desde el teléfono del cliente, el sistema debe estar publicado con base de datos en la nube.</p>`)}
function copiar(){const t=$('#wa_t');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Mensaje copiado'),()=>{t.select();toast('Seleccionado: copiá con Ctrl+C')});else t.select()}
function facturar(){const o=ot(),s=suc(o.sucursalId),n=`${s.est}-${s.pto}-${String(s.nextFac++).padStart(7,'0')}`;
  const ruc=(db.config.ruc||'').replace(/\D/g,'');o.factura={nro:n,fecha:hoy(),cdc:('01'+ruc.padStart(9,'0')+s.est+s.pto+String(s.nextFac-1).padStart(7,'0')+'1'+hoy().replace(/-/g,'')+'1'+Math.floor(Math.random()*1e9)).slice(0,44)};
  save();render();verKude(o.id);toast('Factura '+n+' emitida')}
function verKude(id){const o=db.ots.find(x=>x.id===id),c=db.config,cl=cli(o.clienteId),T=total(o),cdc=o.factura.cdc||'—';
  modalHTML(`<div class="kude"><div class="hd"><div><h2>${esc(c.taller)}</h2><div>RUC ${esc(c.ruc)} · ${esc(c.dir)}</div><div>${esc(sucN(o.sucursalId))} · Tel. ${esc(c.tel)}</div></div>
  <div style="text-align:right"><div>Timbrado Nº <b class="mono">${esc(c.timbrado)}</b></div><div class="sub">Vigente desde ${fdate(c.vigDesde)}</div><h3>FACTURA ELECTRÓNICA</h3><div class="mono"><b>${o.factura.nro}</b></div></div></div>
  <div class="fields"><div><span class="sub">Fecha</span><br>${fdate(o.factura.fecha)}</div><div><span class="sub">Cliente</span><br>${esc(cl.nombre)}</div><div><span class="sub">RUC/CI</span><br>${esc(cl.ruc||'—')}</div><div><span class="sub">Condición</span><br>${saldo(o)>0?'Crédito':'Contado'}</div></div>
  <div class="tscroll"><table><tr><th>Cant.</th><th>Descripción</th><th class="n">P. unit.</th><th class="n">IVA 10%</th></tr>${o.items.map(i=>`<tr><td>${i.cant}</td><td>${esc(i.desc)}</td><td class="n">${gs(i.precio)}</td><td class="n">${gs(i.cant*i.precio)}</td></tr>`).join('')}</table></div>
  <div class="totals"><span>Liquidación IVA 10%: ${gs(T/11)}</span><b>Total ${gs(T)}</b></div>
  <div><span class="sub" style="font-size:11px">CDC</span><div class="cdc">${cdc.replace(/(.{4})/g,'$1 ')}</div></div>
  <p class="note" style="font-size:11px">Representación gráfica de demostración. La validez legal requiere envío a SIFEN (DNIT) con certificado digital.</p></div>
  <div class="row"><button class="btn" onclick="closeM()">Cerrar</button></div>`)}

/* ---------- VISTAS PÚBLICAS ---------- */
function verCliente(v,id){const o=db.ots.find(x=>x.id===id);st.pub=pubDoc(o);st.pubLocal=o.id;go(v,o.token)}
const pubBack=()=>st.pubLocal&&me()?`<div class="row between"><button class="btn sm" onclick="go('ot','${st.pubLocal}')">← Volver al sistema</button><span class="sub">Así lo ve el cliente</span></div>`:'';
const pubHead=(P,t)=>`<div class="panel"><div class="sub" style="text-transform:uppercase;letter-spacing:.06em;font-size:12px">${esc(P.taller.nombre)}</div><h1>${t} OT #${P.nro}</h1>
  <div class="row" style="margin-top:8px">${plate(P.chapa)}<span>${esc(P.marca)} ${esc(P.modelo)}${P.km?' · '+fmt(P.km)+' km':''}</span></div></div>`;
function pubCheck(){if(st.pub===undefined)return '<div class="cli"><p class="empty">Cargando…</p></div>';if(!st.pub)return '<div class="cli"><p class="empty">No encontramos esta orden. Revisá el enlace.</p></div>';return ''}
function clienteView(){const w=pubCheck();if(w)return w;const P=st.pub,done=P.respuesta&&P.respuesta.aprob||P.aprob!=='pendiente';
  return `<div class="cli">${pubBack()}${pubHead(P,'Presupuesto')}
  <div class="panel"><table>${P.items.map(i=>`<tr><td>${esc(i.desc)}<div class="sub" style="font-size:12px">${i.cant} × ${gs(i.precio)}</div></td><td class="n">${gs(i.cant*i.precio)}</td></tr>`).join('')}</table>
  <div class="totals" style="margin-top:10px"><span class="sub">IVA incluido</span><b>${gs(P.total)}</b></div></div>
  <div class="panel">${done?`<p style="margin:0">Respuesta registrada: ${aprobChip((P.respuesta&&P.respuesta.aprob)||P.aprob)}</p>`:`<label class="field"><span>Comentario (opcional)</span><textarea id="cl_n" maxlength="400" placeholder="Ej.: aprobar solo el diagnóstico"></textarea></label>
  <div class="row" style="margin-top:10px"><button class="btn pri" style="flex:1;justify-content:center" onclick="resp('aprobado')">Aceptar todo</button><button class="btn danger" style="flex:1;justify-content:center" onclick="resp('rechazado')">Rechazar</button></div>`}</div></div>`;
}
async function resp(a){const nota=$('#cl_n').value.trim(),f=new Date().toISOString();
  if(st.pubLocal){const o=db.ots.find(x=>x.id===st.pubLocal);o.aprob=a;o.aprobNota=nota;o.aprobFecha=f;if(a==='aprobado'&&['diagnostico','presupuesto'].includes(o.estado)){o.estado='reparacion';o.estadoDesde=f}save();st.pub=pubDoc(o);render();return toast('Presupuesto '+a)}
  try{await FS.collection('publico').doc(st.param).update({respuesta:{aprob:a,nota,fecha:f},procesado:false});st.pub.respuesta={aprob:a};render();toast(a==='aprobado'?'¡Gracias! Presupuesto aprobado.':'Presupuesto rechazado.')}
  catch(e){toast('No se pudo enviar la respuesta. Intente de nuevo o llame al taller.')}}
function encuestaView(){const w=pubCheck();if(w)return w;const P=st.pub;st.nota=st.nota||0;const nota=(P.encuestaResp&&P.encuestaResp.nota)||P.encuesta.nota;
  return `<div class="cli">${pubBack()}${pubHead(P,'¿Cómo lo atendimos?')}
  <div class="panel">${nota?`<p style="margin:0">Gracias por su respuesta ${stars(nota)}</p>`:`<div class="field"><span>Calificación</span><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=st.nota?'on':''}" onclick="st.nota=${n};render()" aria-label="${n} estrellas">★</button>`).join('')}</div></div>
  <label class="field" style="margin-top:10px"><span>Comentario (opcional)</span><textarea id="en_c" maxlength="800" placeholder="¿Qué podemos mejorar?"></textarea></label>
  <div class="row" style="margin-top:10px"><button class="btn pri" onclick="enviarCalif()">Enviar calificación</button></div>`}</div></div>`;
}
async function enviarCalif(){if(!st.nota)return toast('Elegí de 1 a 5 estrellas.');const c=$('#en_c').value.trim();
  if(st.pubLocal){const o=db.ots.find(x=>x.id===st.pubLocal);Object.assign(o.encuesta,{nota:st.nota,comentario:c,fecha:hoy()});st.nota=0;save();st.pub=pubDoc(o);return render()}
  try{await FS.collection('publico').doc(st.param).update({encuestaResp:{nota:st.nota,comentario:c,fecha:new Date().toISOString()},procesado:false});st.pub.encuestaResp={nota:st.nota};st.nota=0;render()}
  catch(e){toast('No se pudo enviar. Intente de nuevo.')}}

/* ---------- HISTORIAL ---------- */
function historial(){
  const q=(st.hq||'').toUpperCase(),mine=isM()?new Set(db.ots.filter(o=>o.mecanicoId===me().mecanicoId).map(o=>o.vehiculoId)):null;
  const vs=db.vehiculos.filter(v=>(!mine||mine.has(v.id))&&(!q||v.chapa.includes(q)||(v.chasis||'').includes(q)));
  return `<h1>Historial del vehículo</h1>
  <input id="hq" placeholder="Buscar por chapa o nº de chasis" value="${esc(st.hq||'')}" oninput="st.hq=this.value;clearTimeout(window._h);window._h=setTimeout(()=>{render();const i=$('#hq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)" style="max-width:420px">
  ${vs.map(v=>{const os=db.ots.filter(o=>o.vehiculoId===v.id).sort((a,b)=>b.km-a.km);const c=cli(v.clienteId),g=garantiaPrev(v.id);
    return `<div class="panel"><div class="row between"><div class="row">${plate(v.chapa,1)}<div><h2>${esc(v.marca)} ${esc(v.modelo)} ${esc(v.anio)}</h2><div class="sub">Chasis <span class="mono">${esc(v.chasis||'—')}</span>${isM()?'':' · '+esc(c.nombre)}</div></div></div>
    <div class="row">${g?`<span class="chip c-warn">En garantía hasta ${fdate(addD(g.fecha,g.garantiaDias))}</span>`:''}${isM()?'':`<span class="sub">${os.length} visitas · ${gs(os.reduce((a,o)=>a+total(o),0))}</span>`}</div></div>
    <div class="timeline" style="margin-top:14px">${os.map(o=>`<div class="tl"><div class="row"><span class="km">${fmt(o.km)} km</span><span class="sub">${fdate(o.fecha)}</span><button class="btn sm" onclick="go('ot','${o.id}')" ${isM()&&o.mecanicoId!==me().mecanicoId?'disabled':''}>OT #${o.nro}</button><span class="chip ${ESTC[o.estado]}">${est(o.estado)}</span>${o.garantiaDe?'<span class="tag gar">Reingreso garantía</span>':''}</div>
      <div style="margin-top:4px">${esc(o.falla)}</div><div class="sub" style="font-size:12px">${o.items.map(i=>esc(i.desc)+(i.tipo==='rep'?` ×${i.cant}`:'')).join(' · ')||'Sin trabajos cargados'}</div></div>`).join('')||'<p class="empty">Sin visitas.</p>'}</div></div>`}).join('')||'<p class="empty">No se encontró ningún vehículo.</p>'}`;
}

/* ---------- STOCK ---------- */
function stockView(){
  const low=db.stock.filter(s=>qty(s)<=s.min).length,A=isA();
  const val=db.stock.reduce((a,s)=>a+qty(s)*s.costo,0);
  const tr=db.movs.filter(m=>m.tipo==='traspaso'&&m.cant>0).slice(-6).reverse();
  return `<div class="row between"><h1>Stock e inventario</h1><div class="row">${A&&db.sucursales.length>1?`<button class="btn" onclick="traspaso()">Traspasar entre sucursales</button>`:''}${A?`<button class="btn pri" onclick="editStock()">+ Nuevo artículo</button>`:''}</div></div>
  <div class="grid kpis"><div class="kpi"><b>${db.stock.length}</b><span>Artículos</span></div><div class="kpi ${low?'alert':''}"><b>${low}</b><span>Bajo mínimo</span></div>${A?`<div class="kpi"><b class="m">${gs(val)}</b><span>Valor al costo</span></div>`:''}</div>
  ${comprasPanel()}
  <div class="panel"><input id="sq" placeholder="Buscar repuesto, aceite o accesorio" value="${esc(st.sq)}" oninput="st.sq=this.value;stockTable()" style="max-width:380px;margin-bottom:10px"><div class="tscroll" id="stt">${stockTableH()}</div></div>
  ${A&&tr.length?`<div class="panel"><h2>Últimos traspasos</h2><table><tr><th>Fecha</th><th>Artículo</th><th>Destino</th><th>Detalle</th><th class="n">Cant.</th></tr>${tr.map(m=>`<tr><td>${fdate(m.fecha)}</td><td>${esc((db.stock.find(s=>s.id===m.stockId)||{}).desc)}</td><td>${esc(sucN(m.suc))}</td><td class="sub">${esc(m.ref)}</td><td class="n">${m.cant}</td></tr>`).join('')}</table></div>`:''}`;
}
function stockTable(){$('#stt').innerHTML=stockTableH()}
function stockTableH(){const q=st.sq.toLowerCase(),A=isA(),multi=db.sucursales.length>1;

function adj(id,d){const s=db.stock.find(x=>x.id===id);const n=s.ex[st.suc]||0;if(n+d<0)return;s.ex[st.suc]=n+d;mov(s.id,st.suc,d,d>0?'compra':'ajuste','Ajuste manual');save();stockTable()}
function editStock(id){const s=db.stock.find(x=>x.id===id)||{cod:'',desc:'',cat:'',ex:{},min:1,costo:0,precio:0};const ws=workSuc();
  modalHTML(`<h2>${id?'Editar':'Nuevo'} artículo</h2><div class="fields">${[['cod','Código'],['desc','Descripción'],['cat','Categoría'],['min','Stock mínimo'],['costo','Costo (Gs.)'],['precio','Precio venta (Gs.)']].map(([k,l])=>`<label class="field"><span>${l}</span><input id="sk_${k}" value="${esc(s[k])}"></label>`).join('')}
  ${db.sucursales.map(x=>`<label class="field"><span>Stock en ${esc(x.nombre)}</span><input id="sk_ex_${x.id}" value="${s.ex[x.id]||0}" inputmode="numeric"></label>`).join('')}</div>
  <div class="row"><button class="btn pri" onclick="saveStock('${id||''}')">Guardar</button><button class="btn" onclick="closeM()">Cancelar</button>${id?`<button class="btn danger" onclick="db.stock=db.stock.filter(x=>x.id!=='${id}');save();closeM();render()">Eliminar</button>`:''}</div>`)}
function saveStock(id){const g=k=>$('#sk_'+k).value.trim();if(!g('desc'))return toast('Falta la descripción.');
  let s=db.stock.find(x=>x.id===id);if(!s){s={id:uid(),ex:{}};db.stock.push(s)}
  db.sucursales.forEach(x=>{const n=num(g('ex_'+x.id)),d=n-(s.ex[x.id]||0);if(d)mov(s.id,x.id,d,d>0?'compra':'ajuste','Edición de artículo');s.ex[x.id]=n});
  Object.assign(s,{cod:g('cod').toUpperCase(),desc:g('desc'),cat:g('cat'),min:num(g('min')),costo:num(g('costo')),precio:num(g('precio'))});save();closeM();render();toast('Artículo guardado')}
function traspaso(pre){const o=db.sucursales;
  modalHTML(`<h2>Traspaso de stock</h2><div class="fields">
  <label class="field" style="grid-column:1/-1"><span>Artículo</span><select id="tr_s" onchange="trInfo()">${db.stock.map(s=>`<option value="${s.id}" ${pre===s.id?'selected':''}>${esc(s.cod)} · ${esc(s.desc)}</option>`).join('')}</select></label>

  <label class="field"><span>Hacia</span><select id="tr_d">${o.map((x,i)=>`<option value="${x.id}" ${i===1?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label>

function trInfo(){const s=db.stock.find(x=>x.id===$('#tr_s').value);$('#tr_i').textContent='Disponible: '+db.sucursales.map(x=>x.nombre+' '+(s.ex[x.id]||0)).join(' · ')}
function doTraspaso(){const s=db.stock.find(x=>x.id===$('#tr_s').value),a=$('#tr_o').value,b=$('#tr_d').value,q=num($('#tr_c').value);
  if(a===b)return toast('Origen y destino deben ser distintos.');if(q<1)return toast('Ingresá una cantidad.');if(q>(s.ex[a]||0))return toast(`Solo hay ${s.ex[a]||0} en ${sucN(a)}.`);
  s.ex[a]-=q;s.ex[b]=(s.ex[b]||0)+q;mov(s.id,a,-q,'traspaso','A '+sucN(b));mov(s.id,b,q,'traspaso','Desde '+sucN(a));save();closeM();render();toast(`${q} × ${s.desc} → ${sucN(b)}`)}

function recordatorios(){
  const T=hoy(),out=[];
  db.vehiculos.forEach(v=>{const last=db.ots.filter(o=>o.vehiculoId===v.id&&o.estado==='entregado'&&inSuc(o)).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(!last||!last.proxServ)return;const due=addM(last.fecha,last.proxServ.meses),d=dias(T,due);
    if(d<=30)out.push({o:last,v,due,dias:d})});
  return out.sort((a,b)=>a.dias-b.dias);
}

function rotacion(){
  const T=hoy(),D=db.config.diasEstancado,cov=db.config.coberturaDias;
  return db.stock.map(s=>{const us=db.movs.filter(m=>m.stockId===s.id&&m.tipo==='uso'&&(st.suc==='*'||m.suc===st.suc));
    const u90=-us.filter(m=>dias(m.fecha,T)<=90).reduce((a,m)=>a+m.cant,0);const last=us.map(m=>m.fecha).sort().pop();
    const q=qty(s),diario=u90/90,cobertura=diario?q/diario:Infinity,sug=Math.max(0,Math.ceil(diario*cov*1.5-q));
    const sinMov=last?dias(last,T):999;
    return {s,u90,q,last,sinMov,cobertura,sug,estancado:q>0&&sinMov>=D,alta:u90>=15}}).sort((a,b)=>b.u90-a.u90);
}

function barChart(ms){
  if(!ms.length)return '<p class="empty">Sin datos.</p>';
  const W=640,H=230,pl=40,pb=40,pt=16,max=Math.max(1,...ms.flatMap(x=>[x.e,x.r]));const step=max>20?10:max>8?4:max>4?2:1,top=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top),gw=(W-pl-10)/ms.length,bw=Math.min(34,gw/3.2);
  let g='';for(let t=0;t<=top;t+=step)g+=`<line x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}h</text>`;
  ms.forEach((x,i)=>{const cx=pl+gw*i+gw/2;[[x.e,'var(--blue)',-bw-2],[x.r,'var(--accent)',2]].forEach(([v,c,dx])=>{g+=`<rect x="${cx+dx}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${c}"/>`;if(v)g+=`<text x="${cx+dx+bw/2}" y="${y(v)-4}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${(Math.round(v*10)/10).toString().replace('.',',')}</text>`});
    g+=`<text x="${cx}" y="${H-pb+16}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="IBM Plex Sans,sans-serif">${esc(x.m.nombre)}</text><text x="${cx}" y="${H-pb+30}" text-anchor="middle" font-size="11" fill="${x.ef>=100?'var(--ok)':'var(--bad)'}" font-family="IBM Plex Mono,monospace">${x.r?Math.round(x.ef)+'%':''}</text>`});
  return `<div class="tscroll"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px" role="img" aria-label="Horas estimadas contra horas reales por mecánico">${g}</svg></div>`;
}

function semaforoView(){

function semCard(o,l){const v=veh(o.vehiculoId),h=horasEn(o),late=l.limite&&h>l.limite;

  ${l.id==='verde'?`<div class="mini">${[['reparacion','Reparación'],['calidad','Calidad'],['listo','Listo']].map(([k,t])=>`<button class="${o.estado===k?'on':''}" onclick="event.stopPropagation();moveTo(db.ots.find(x=>x.id==='${o.id}'),'${k}')">${t}</button>`).join('')}</div>`:''}
  <span class="age ${late?'late':''}">${late?'Demorado · ':''}${edad(h)} en esta etapa</span></div>`}
let DR=null;
function bindSem(){document.querySelectorAll('.sem .card').forEach(c=>c.addEventListener('pointerdown',dragStart))}
function laneAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('.lane')}
function dragStart(e){if(e.button>0||e.target.closest('button'))return;const c=e.currentTarget;DR={id:c.dataset.id,c,x:e.clientX,y:e.clientY,moved:false};
  c.addEventListener('pointermove',dragMove);c.addEventListener('pointerup',dragEnd);c.addEventListener('pointercancel',dragStop);try{c.setPointerCapture(e.pointerId)}catch(_){}}
function dragMove(e){if(!DR)return;
  if(!DR.moved){if(Math.hypot(e.clientX-DR.x,e.clientY-DR.y)<7)return;DR.moved=true;const r=DR.c.getBoundingClientRect();DR.ox=DR.x-r.left;DR.oy=DR.y-r.top;
    DR.g=DR.c.cloneNode(true);DR.g.classList.add('ghost');DR.g.style.width=r.width+'px';document.body.appendChild(DR.g);DR.c.classList.add('drag-src')}
  e.preventDefault();DR.g.style.left=(e.clientX-DR.ox)+'px';DR.g.style.top=(e.clientY-DR.oy)+'px';
  const ln=laneAt(e.clientX,e.clientY);document.querySelectorAll('.lane').forEach(l=>l.classList.toggle('over',l===ln))}
function dragStop(){if(!DR)return null;const d=DR,c=d.c;DR=null;c.removeEventListener('pointermove',dragMove);c.removeEventListener('pointerup',dragEnd);c.removeEventListener('pointercancel',dragStop);
  d.g?.remove();c.classList.remove('drag-src');document.querySelectorAll('.lane.over').forEach(l=>l.classList.remove('over'));return d}
function dragEnd(e){const d=dragStop();if(!d)return;if(!d.moved){go('ot',d.id);return}
  const ln=laneAt(e.clientX,e.clientY);if(!ln)return;const L=LANES.find(l=>l.id===ln.dataset.lane),o=db.ots.find(x=>x.id===d.id);if(!L||L.estados.includes(o.estado))return;moveTo(o,L.target)}
function scanBox(){return `<form class="row" style="gap:6px" onsubmit="event.preventDefault();buscarOT($('#scan').value)"><input id="scan" placeholder="Escanear código, nº de OT o chapa" style="width:250px" autocomplete="off" aria-label="Buscar orden"><button class="btn">Abrir</button></form>`}
function buscarOT(q){q=(q||'').trim();if(!q)return;let o;const mh=q.match(/#ot-([a-z0-9]+)/i);
  if(mh)o=db.ots.find(x=>x.id===mh[1]);
  if(!o){const mn=q.match(/^(?:OT)?[-\s#]*0*(\d+)$/i);if(mn)o=db.ots.find(x=>x.nro===+mn[1])}
  if(!o){const c=q.toUpperCase().replace(/\s/g,'');o=db.ots.filter(x=>veh(x.vehiculoId).chapa.replace(/\s/g,'').includes(c)).sort((a,b)=>(a.estado==='entregado')-(b.estado==='entregado')||b.nro-a.nro)[0]}
  if(!o)return toast('No se encontró ninguna OT con “'+q+'”.');
  if(isM()&&o.mecanicoId!==me().mecanicoId)return toast(`La OT #${o.nro} no está asignada a vos.`);go('ot',o.id)}

function comprasPanel(){const al=db.alertas.filter(a=>!a.resuelta&&inSuc(db.ots.find(x=>x.id===a.otId)||{sucursalId:st.suc}));if(!al.length)return '';

exports.waNotifica = onDocumentWritten('ots/{id}', async (ev) => {

  await fetch(\`https://graph.facebook.com/v21.0/\${process.env.WA_PHONE_ID}/messages\`, {

    headers: { Authorization: \`Bearer \${process.env.WA_TOKEN}\`, 'Content-Type': 'application/json' },

});`;

function drawCodes(root){

    const n=q.getModuleCount(),cell=6,m=2,S=(n+m*2)*cell;cv.width=cv.height=S;const x=cv.getContext('2d');if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,S,S);x.fillStyle='#000';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell)});
  root.querySelectorAll('canvas[data-bar]').forEach(cv=>{if(typeof JsBarcode!=='function')return;try{JsBarcode(cv,cv.dataset.bar,{format:'CODE128',width:2,height:54,fontSize:14,margin:4,font:'IBM Plex Mono',textMargin:2})}catch(e){}});

  return `<h1>Pagos</h1>

  <div class="panel"><div class="row between"><h2>Pagos registrados</h2><select style="width:auto" onchange="st.dm=this.value;renderDev()"><option value="todos" ${mes==='todos'?'selected':''}>Todos</option>${meses.map(m=>`<option value="${m}" ${m===mes?'selected':''}>${lbl(m)}</option>`).join('')}</select></div>
  <div class="tscroll"><table><tr><th>Fecha</th><th>Taller</th><th>Plan</th><th>Método</th><th>Nota</th><th>Válido hasta</th><th class="n">Monto</th><th></th></tr>
  ${list.map(p=>`<tr><td>${fdate(p.fecha)}</td><td>${esc(p.taller)}</td><td>${esc(p.planNombre)}${p.periodos>1?' ×'+p.periodos:''}</td><td>${esc(p.metodo)}</td><td class="sub">${esc(p.nota||'')}</td><td>${p.hasta?fdate(p.hasta):'Sin vencimiento'}</td><td class="n">${gs(p.monto)}</td>
  <td><button class="btn sm danger" onclick="anularPago('${p.id}')">Anular</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sin pagos en este período.</td></tr>'}
  ${list.length?`<tr><td colspan="6"><b>Total</b></td><td class="n"><b>${gs(list.reduce((a,p)=>a+p.monto,0))}</b></td><td></td></tr>`:''}</table></div></div>`}

/* ---------- CAJA Y FACTURAS ---------- */
function finanzas(){
  const os=db.ots.filter(inSuc);
  const fac=os.filter(o=>o.factura).sort((a,b)=>b.factura.nro.localeCompare(a.factura.nro));
  const cc=db.clientes.map(c=>{const x=os.filter(o=>o.clienteId===c.id&&o.aprob==='aprobado');return {c,os:x,deuda:x.reduce((a,o)=>a+saldo(o),0),tot:x.reduce((a,o)=>a+total(o),0)}}).filter(x=>x.os.length).sort((a,b)=>b.deuda-a.deuda);
  const pend=os.filter(o=>o.aprob==='pendiente'&&o.items.length);
  const ventas=fac.reduce((a,o)=>a+total(o),0);
  const hoyP=os.flatMap(o=>o.pagos).filter(p=>p.fecha===hoy());
  const medios={};hoyP.forEach(p=>medios[p.medio]=(medios[p.medio]||0)+p.monto);
  return `<h1>Caja y facturas</h1>
  <div class="grid kpis"><div class="kpi"><b class="m">${gs(hoyP.reduce((a,p)=>a+p.monto,0))}</b><span>Caja de hoy</span></div><div class="kpi"><b class="m">${gs(ventas)}</b><span>Total facturado</span></div><div class="kpi"><b class="m">${gs(ventas/11)}</b><span>IVA débito 10%</span></div>
  <div class="kpi ${cc.some(x=>x.deuda>0)?'alert':''}"><b class="m">${gs(cc.reduce((a,x)=>a+Math.max(0,x.deuda),0))}</b><span>Cuentas por cobrar</span></div><div class="kpi"><b>${pend.length}</b><span>Presupuestos abiertos</span></div></div>
  ${Object.keys(medios).length?`<div class="panel"><h2>Caja de hoy por medio de pago</h2><div class="row">${Object.entries(medios).map(([k,v])=>`<span class="tag">${esc(k)}</span><b class="mono">${gs(v)}</b>`).join('<span class="sub">·</span>')}</div></div>`:''}
  <div class="panel"><h2>Cuentas corrientes</h2><div class="tscroll"><table><tr><th>Cliente</th><th>RUC/CI</th><th class="n">OTs</th><th class="n">Total</th><th class="n">Saldo</th></tr>
  ${cc.map(x=>`<tr><td>${esc(x.c.nombre)}<div class="sub" style="font-size:12px">${x.os.filter(o=>saldo(o)>0).map(o=>`<a href="#" onclick="go('ot','${o.id}');return false" style="color:inherit">#${o.nro}</a>`).join(' · ')}</div></td><td class="mono">${esc(x.c.ruc)}</td><td class="n">${x.os.length}</td><td class="n">${gs(x.tot)}</td><td class="n" style="font-weight:600;color:${x.deuda>0?'var(--bad)':'var(--ok)'}">${gs(x.deuda)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin movimientos.</td></tr>'}</table></div></div>
  <div class="grid g2"><div class="panel"><h2>Facturas emitidas</h2><div class="tscroll"><table><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th class="n">Total</th></tr>
  ${fac.map(o=>`<tr class="click" onclick="verKude('${o.id}')"><td class="mono">${o.factura.nro}</td><td>${fdate(o.factura.fecha)}</td><td>${esc(cli(o.clienteId).nombre)}</td><td class="n">${gs(total(o))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Aún no hay facturas.</td></tr>'}</table></div></div>
  <div class="panel"><h2>Presupuestos esperando respuesta</h2>${pend.map(o=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="row">${plate(veh(o.vehiculoId).chapa)} <span>OT #${o.nro} · ${esc(cli(o.clienteId).nombre)}</span></span><span class="row"><b class="mono">${gs(total(o))}</b><button class="btn sm" onclick="go('ot','${o.id}')">Abrir</button></span></div>`).join('')||'<p class="empty">Ningún presupuesto pendiente.</p>'}</div></div>`;
}

  <label class="field" id="nu_mw" hidden><span>Mecánico vinculado</span><select id="nu_m"><option value="">—</option>${db.mecanicos.map(m=>`<option value="${m.id}">${esc(m.nombre)}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn pri" id="nu_b">Crear usuario</button><button type="button" class="btn" onclick="closeM()">Cancelar</button></div></form>`)}
async function crearUsuario(){const n=$('#nu_n').value.trim(),us=$('#nu_u').value.trim().toLowerCase(),pw=$('#nu_p').value,r=$('#nu_r').value,b=$('#nu_b');
  b.disabled=true;b.textContent='Creando…';
  try{const id=await crearCuentaAuth(us,pw);
    await FS.collection('usuarios').doc(id).set({tallerId:st.tid,nombre:n,usuario:us,email:loginEmail(us),rol:r,sucursalId:$('#nu_s').value,mecanicoId:r==='mecanico'?$('#nu_m').value:'',activo:true,cambiarClave:true,creado:new Date().toISOString()});
    const msg=`Hola ${n.split(' ')[0]}, ya tenés acceso al sistema de *${db.config.taller}*.\nIngresá en: ${appBase()}\nUsuario: ${us}\nContraseña temporal: ${pw}\nAl primer ingreso te va a pedir cambiarla.`;
    modalHTML(`<h2>Usuario creado</h2><p style="margin:0">Pasale estos datos a ${esc(n)}:</p><pre class="cred" id="wa_t">${esc(msg)}</pre><div class="row"><button class="btn" onclick="copiarTxt($('#wa_t').textContent,'Datos copiados')">Copiar</button><button class="btn pri" onclick="closeM()">Listo</button></div>`)}
  catch(e){b.disabled=false;b.textContent='Crear usuario';toast(e.code==='auth/email-already-in-use'?'Ese nombre de usuario ya existe. Elegí otro.':authMsg(e))}}
function respaldo(){const d={};COLS.forEach(c=>d[c]=db[c]);d.config=db.config;const t=JSON.stringify(d);const b=new Blob([t],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`respaldo-taller-${hoy()}.json`;document.body.appendChild(a);a.click();a.remove();toast('Respaldo descargado')}
function restaurar(){try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.ots))throw 0;COLS.filter(c=>c!=='usuarios').forEach(c=>{if(Array.isArray(d[c]))db[c]=d[c]});if(d.config)Object.assign(db.config,d.config);save();render();toast('Respaldo restaurado')}catch(e){toast('El texto pegado no es un respaldo válido.')}}
const usr=id=>db.usuarios.find(u=>u.id===id);
function saveCfg(){['taller','ruc','dir','tel','timbrado','vigDesde','telCompras','urlPublica'].forEach(k=>db.config[k]=$('#cf_'+k).value.trim());['garantiaDef','bono','diasEstancado','coberturaDias','elevadores'].forEach(k=>db.config[k]=num($('#cf_'+k).value));save();toast('Configuración guardada')}

const h0=(location.hash||'').slice(1),pm=h0.match(/^(aprobar|encuesta|seguimiento)-([A-Za-z0-9]+)$/);
db=emptyDB();
if(typeof firebase==='undefined'){st.fase='error';st.err='No se pudo cargar Firebase. Revisá la conexión a internet.';render()}
else if(!fbOK()){st.fase='setup';render()}
else{initFB();
  if(pm){st.view={aprobar:'cliente',encuesta:'encuesta',seguimiento:'seguimiento'}[pm[1]];st.param=pm[2];st.pub=undefined;render();
    FS.collection('publico').doc(pm[2]).onSnapshot(d=>{st.pub=d.exists?d.data():null;st.pubLocal=null;render()},()=>{st.pub=null;render()})}
  else{if(h0.startsWith('ot-'))st.pendOT=h0.slice(3);st.fase='cargando';render();AUTH.onAuthStateChanged(onAuth)}}
tick();
</script>
