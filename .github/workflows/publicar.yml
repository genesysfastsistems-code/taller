name: Publicar sistema y padrón RUC (DNIT)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 3 * *"   # día 3 de cada mes, 06:17 hora de Paraguay
  workflow_dispatch:
    inputs:
      forzar:
        description: "Volver a descargar el padrón de la DNIT"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar padrón RUC anterior
        uses: actions/cache/restore@v4
        with:
          path: _site/ruc
          key: ruc-${{ github.run_id }}
          restore-keys: ruc-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar padrón de la DNIT y armar índice
        env:
          FORZAR: ${{ (github.event_name == 'schedule' || inputs.forzar) && '1' || '0' }}
        run: python tools/build_ruc.py _site/ruc

      - name: Guardar padrón para la próxima publicación
        uses: actions/cache/save@v4
        with:
          path: _site/ruc
          key: ruc-${{ github.run_id }}

      - name: Copiar el sistema
        run: |
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' ./ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
